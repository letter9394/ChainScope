name: ChainScope restore verified backup to empty Neon

on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: Successful GitHub Actions run that produced the encrypted Render backup
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: chainscope-neon-restore
  cancel-in-progress: false

jobs:
  verified-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed restore script
        uses: actions/checkout@v4

      - name: Test the backup and row-count parsers
        run: |
          node --test scripts/test-ci-backup-crypto.mjs
          node --test scripts/test-pg-dump-row-counts.mjs

      - name: Download the encrypted Render backup
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.backup_run_id }}
          name: chainscope-render-encrypted-backup
          path: ${{ runner.temp }}/chainscope-encrypted-backup
          github-token: ${{ github.token }}

      - name: Authenticate and decrypt the archive on this runner
        env:
          CHAINSCOPE_MIGRATION_KEY_B64: ${{ secrets.CHAINSCOPE_MIGRATION_KEY_B64 }}
        run: |
          node scripts/decrypt-ci-backup.mjs \
            "$RUNNER_TEMP/chainscope-encrypted-backup/chainscope-render-latest.dump.enc" \
            "$RUNNER_TEMP/chainscope-encrypted-backup/chainscope-render-latest.manifest.json" \
            "$RUNNER_TEMP/chainscope-render-latest.dump"

      - name: Restore only to the expected empty Neon database and compare every table
        env:
          CHAINSCOPE_MIGRATION_NEON_DIRECT_URL: ${{ secrets.CHAINSCOPE_MIGRATION_NEON_DIRECT_URL }}
          CHAINSCOPE_RESTORE_REPORT: ${{ runner.temp }}/chainscope-neon-restore-verification.json
        run: |
          node scripts/ci-neon-restore.mjs \
            "$RUNNER_TEMP/chainscope-render-latest.dump" \
            "$RUNNER_TEMP/chainscope-encrypted-backup/chainscope-render-latest.manifest.json"

      - name: Keep the non-sensitive verification report
        uses: actions/upload-artifact@v4
        with:
          name: chainscope-neon-restore-verification
          path: ${{ runner.temp }}/chainscope-neon-restore-verification.json
          if-no-files-found: error
          retention-days: 1

      - name: Remove the plaintext archive from the runner
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/chainscope-render-latest.dump" \
            "$RUNNER_TEMP/chainscope-render-latest.dump.sha256"
