name: ChainScope one-time Render backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chainscope-render-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the reviewed backup script
        uses: actions/checkout@v4

      - name: Verify the archive encryption format
        run: node --test scripts/test-ci-backup-crypto.mjs

      - name: Identify this runner's public IP
        id: runner_ip
        shell: bash
        run: |
          ip="$(curl --fail --silent --show-error --max-time 12 https://api.ipify.org)"
          if [[ ! "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo 'Could not identify an IPv4 runner address.' >&2
            exit 1
          fi
          printf '%s\n' "$ip" > "$RUNNER_TEMP/chainscope-runner-ip.txt"
          printf 'runner_ip=%s\n' "$ip" >> "$GITHUB_OUTPUT"

      - name: Publish the temporary runner IP for one-address allowlisting
        uses: actions/upload-artifact@v4
        with:
          name: chainscope-runner-ip
          path: ${{ runner.temp }}/chainscope-runner-ip.txt
          if-no-files-found: error
          retention-days: 1

      - name: Create and verify encrypted full backup
        env:
          CHAINSCOPE_MIGRATION_RENDER_URL: ${{ secrets.CHAINSCOPE_MIGRATION_RENDER_URL }}
          CHAINSCOPE_MIGRATION_KEY_B64: ${{ secrets.CHAINSCOPE_MIGRATION_KEY_B64 }}
          CHAINSCOPE_RUNNER_IP: ${{ steps.runner_ip.outputs.runner_ip }}
          CHAINSCOPE_BACKUP_OUT: ${{ runner.temp }}/chainscope-encrypted-backup
        run: node scripts/ci-render-backup.mjs

      - name: Keep only the encrypted archive and its manifest
        uses: actions/upload-artifact@v4
        with:
          name: chainscope-render-encrypted-backup
          path: |
            ${{ runner.temp }}/chainscope-encrypted-backup/chainscope-render-latest.dump.enc
            ${{ runner.temp }}/chainscope-encrypted-backup/chainscope-render-latest.manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
