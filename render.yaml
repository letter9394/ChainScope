databases:
  - name: chainscope-db
    plan: free
    region: singapore
    databaseName: chainscope
    user: chainscope
    ipAllowList: []

services:
  - type: web
    name: chainscope-web3
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: CHAIN_SCOPE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chainscope-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: BACKGROUND_ALERTS_ENABLED
        value: "true"
      - key: ALERT_CHECK_SECONDS
        value: "60"
      - key: PUBLIC_APP_URL
        value: https://chainscope-web3.onrender.com
      - key: MASSIVE_API_URL
        value: https://api.massive.com
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: SMTP_HOST
        value: smtp.qq.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURITY
        value: ssl
      - key: STATIC_DIR
        value: /app/static
