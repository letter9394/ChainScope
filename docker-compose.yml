services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chainscope
      POSTGRES_USER: chainscope
      POSTGRES_PASSWORD: chainscope-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainscope"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - chainscope-postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      CHAIN_SCOPE_ENV: development
      DATABASE_URL: postgresql+psycopg://chainscope:chainscope-local@postgres:5432/chainscope
      SESSION_SECRET: local-docker-secret-change-before-public-use
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3100:3100"

volumes:
  chainscope-postgres:
