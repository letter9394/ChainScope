services:
  backend:
    build: ./backend
    environment:
      CHAIN_SCOPE_ENV: production
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
      AI_API_BASE_URL: ${AI_API_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - chainscope-data:/app/.local
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3100:3100"

volumes:
  chainscope-data:
